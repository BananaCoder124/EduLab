<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opettajien Materiaalipankki (Demo)</title>
    <!-- Tailwind CSS tyylit -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col">

    <!-- Kirjautumisnäkymä -->
    <div id="auth-view" class="flex items-center justify-center flex-grow p-4">
        <div class="bg-white p-8 rounded-xl shadow-md w-full max-w-md border border-slate-100">
            <div class="text-center mb-6">
                <span class="text-4xl">📚</span>
                <h1 class="text-2xl font-bold text-slate-900 mt-2">Opettajien Materiaalipankki</h1>
                <p class="text-sm text-slate-500">Yhteinen alusta aineenopettajille</p>
            </div>

            <!-- Välilehdet -->
            <div class="flex border-b border-slate-200 mb-6">
                <button id="tab-signin" onclick="switchTab('signin')" class="flex-1 pb-2 font-medium text-blue-600 border-b-2 border-blue-600 text-center">Kirjaudu</button>
                <button id="tab-signup" onclick="switchTab('signup')" class="flex-1 pb-2 font-medium text-slate-400 text-center">Rekisteröidy</button>
            </div>

            <!-- Lomake -->
            <form id="auth-form" onsubmit="handleAuth(event)" class="space-y-4">
                <div id="name-field" class="hidden">
                    <label class="block text-sm font-medium text-slate-700 mb-1">Koko nimi</label>
                    <input type="text" id="reg-name" placeholder="Matti Meikäläinen" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Sähköposti</label>
                    <input type="email" id="auth-email" required placeholder="opettaja@koulu.fi" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Salasana (väh. 6 merkkiä)</label>
                    <input type="password" id="auth-password" required minlength="6" placeholder="••••••••" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div id="auth-error" class="text-red-500 text-sm hidden"></div>
                <button type="submit" id="auth-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 rounded-lg transition">Kirjaudu sisään</button>
            </form>
        </div>
    </div>

    <!-- Päänäkymä / Materiaalipankki (piilossa aluksi) -->
    <div id="app-view" class="hidden flex-grow flex flex-col">
        <!-- Yläpalkki -->
        <header class="bg-white border-b border-slate-200 px-6 py-4 flex justify-between items-center shadow-sm">
            <div class="flex items-center space-x-3">
                <span class="text-2xl">📚</span>
                <span class="font-bold text-lg text-slate-900">Opettajien Materiaalipankki</span>
            </div>
            <div class="flex items-center space-x-4">
                <span id="logged-in-user" class="text-sm text-slate-600 font-medium"></span>
                <button onclick="logout()" class="text-sm text-red-600 hover:underline">Kirjaudu ulos</button>
            </div>
        </header>

        <!-- Sisältöalue -->
        <main class="max-w-6xl w-full mx-auto p-6 flex-grow grid grid-cols-1 md:grid-cols-3 gap-6">
            
            <!-- Vasen: Lisää uusi materiaali -->
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 h-fit">
                <h2 class="text-lg font-semibold text-slate-900 mb-4">Lisää uusi materiaali</h2>
                <form onsubmit="addMaterial(event)" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Otsikko</label>
                        <input type="text" id="mat-title" required placeholder="Esim. Vapaa pudotus -labra" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Oppiaine / Kategoria</label>
                        <select id="mat-category" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm bg-white">
                            <option value="Matematiikka">Matematiikka</option>
                            <option value="Fysiikka">Fysiikka</option>
                            <option value="Kemia">Kemia</option>
                            <option value="Biologia">Biologia</option>
                            <option value="Maantiede (maantieto)">Maantiede (maantieto)</option>
                            <option value="Ympäristöoppi">Ympäristöoppi (varhaiskasvatus / alakoulu)</option>
                            <option value="Tietotekniikka ja teknologia">Tietotekniikka ja teknologia</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Kuvaus & Ohjeet</label>
                        <textarea id="mat-desc" required rows="4" placeholder="Kerro lyhyesti materiaalista ja sen käytöstä..." class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm"></textarea>
                    </div>
                    <div class="flex items-center space-x-2">
                        <input type="checkbox" id="mat-anonymous" class="rounded border-slate-300 text-blue-600 focus:ring-blue-500">
                        <label for="mat-anonymous" class="text-sm text-slate-600">Julkaise anonyymisti</label>
                    </div>
                    <button type="submit" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-medium py-2 rounded-lg text-sm transition">Julkaise materiaalipankkiin</button>
                </form>
            </div>

            <!-- Oikea: Materiaalilistaus ja suodatus -->
            <div class="md:col-span-2 space-y-4">
                <div class="flex flex-col sm:flex-row justify-between items-stretch sm:items-center gap-3">
                    <!-- Suodatus aineen mukaan -->
                    <select id="filter-category" onchange="filterMaterials()" class="px-3 py-2 border border-slate-300 rounded-lg text-sm bg-white font-medium">
                        <option value="Kaikki">Kaikki aineet</option>
                        <option value="Matematiikka">Matematiikka</option>
                        <option value="Fysiikka">Fysiikka</option>
                        <option value="Kemia">Kemia</option>
                        <option value="Biologia">Biologia</option>
                        <option value="Maantiede (maantieto)">Maantiede (maantieto)</option>
                        <option value="Ympäristöoppi">Ympäristöoppi</option>
                        <option value="Tietotekniikka ja teknologia">Tietotekniikka ja teknologia</option>
                    </select>

                    <!-- Hakukenttä -->
                    <input type="text" id="search-box" oninput="filterMaterials()" placeholder="Hae avainsanalla..." class="px-3 py-2 border border-slate-300 rounded-lg text-sm w-full sm:w-64">
                </div>

                <!-- Materiaalilista -->
                <div id="materials-container" class="space-y-4">
                    <!-- Kortit generoidaan JavaScriptillä -->
                </div>
            </div>
        </main>
    </div>

    <!-- JavaScript-logiikka -->
    <script>
        let currentMode = 'signin';
        let currentUser = null;

        // Esitäytetyt demomateriaalit eri aineista
        let materials = [
            {
                id: 1,
                title: "Matkapuhelimen kiihtyvyysanturin käyttö dynamiikassa",
                category: "Fysiikka",
                desc: "Oppilaat mittaavat puhelimen sovelluksella hissin kiihtyvyyttä tai heittoliikettä. Erittäin motivoiva työ!",
                author: "Leena Virtanen",
                date: "24.10.2026"
            },
            {
                id: 2,
                title: "Funktioiden optimointitehtävät arkielämässä",
                category: "Matematiikka",
                desc: "Käytännön harjoitus, jossa lasketaan laatikon tilavuuden maksimointia levystä leikkaamalla.",
                author: "Matti Matikka",
                date: "23.10.2026"
            },
            {
                id: 3,
                title: "Oman lähiluonnon puiden tunnistuspassi",
                category: "Ympäristöoppi",
                desc: "Alakoulun oppilaille suunnattu tehtävä, jossa valokuvataan ja kerätään lehdistä näytteitä.",
                author: "Anonyymi opettaja",
                date: "21.10.2026"
            }
        ];

        function switchTab(mode) {
            currentMode = mode;
            const signinBtn = document.getElementById('tab-signin');
            const signupBtn = document.getElementById('tab-signup');
            const nameField = document.getElementById('name-field');
            const authBtn = document.getElementById('auth-btn');
            const errorDiv = document.getElementById('auth-error');

            errorDiv.classList.add('hidden');

            if (mode === 'signin') {
                signinBtn.className = "flex-1 pb-2 font-medium text-blue-600 border-b-2 border-blue-600 text-center";
                signupBtn.className = "flex-1 pb-2 font-medium text-slate-400 text-center";
                nameField.classList.add('hidden');
                authBtn.innerText = "Kirjaudu sisään";
            } else {
                signupBtn.className = "flex-1 pb-2 font-medium text-blue-600 border-b-2 border-blue-600 text-center";
                signinBtn.className = "flex-1 pb-2 font-medium text-slate-400 text-center";
                nameField.classList.remove('hidden');
                authBtn.innerText = "Rekisteröidy";
            }
        }

        function handleAuth(event) {
            event.preventDefault();
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            const nameInput = document.getElementById('reg-name').value;
            const errorDiv = document.getElementById('auth-error');

            if (password.length < 6) {
                errorDiv.innerText = "Salasanan tulee olla vähintään 6 merkkiä pitkä.";
                errorDiv.classList.remove('hidden');
                return;
            }

            currentUser = currentMode === 'signup' && nameInput ? nameInput : email.split('@')[0];
            
            document.getElementById('auth-view').classList.add('hidden');
            document.getElementById('app-view').classList.remove('hidden');
            document.getElementById('logged-in-user').innerText = `Kirjautuneena: ${currentUser}`;
            
            renderMaterials();
        }

        function logout() {
            currentUser = null;
            document.getElementById('app-view').classList.add('hidden');
            document.getElementById('auth-view').classList.remove('hidden');
            document.getElementById('auth-form').reset();
        }

        function renderMaterials() {
            const container = document.getElementById('materials-container');
            const selectedCategory = document.getElementById('filter-category').value;
            const searchQuery = document.getElementById('search-box').value.toLowerCase();
            
            container.innerHTML = '';

            const filtered = materials.filter(m => {
                const matchesCategory = (selectedCategory === 'Kaikki' || m.category === selectedCategory);
                const matchesSearch = m.title.toLowerCase().includes(searchQuery) || 
                                      m.desc.toLowerCase().includes(searchQuery) ||
                                      m.category.toLowerCase().includes(searchQuery);
                return matchesCategory && matchesSearch;
            });

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="bg-white p-8 rounded-xl shadow-sm border border-slate-200 text-center">
                        <p class="text-slate-500 text-sm font-medium">Ei tuloksia vielä.</p>
                        <p class="text-slate-400 text-xs mt-1">Kokeile vaihtaa hakuehtoja tai oppiainetta.</p>
                    </div>
                `;
                return;
            }

            filtered.forEach(m => {
                const card = document.createElement('div');
                card.className = "bg-white p-5 rounded-xl shadow-sm border border-slate-200 flex flex-col justify-between";
                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-start mb-2">
                            <span class="px-2.5 py-1 bg-blue-50 text-blue-700 text-xs font-semibold rounded-full">${m.category}</span>
                            <span class="text-xs text-slate-400">${m.date}</span>
                        </div>
                        <h3 class="font-bold text-slate-900 text-base mb-1">${m.title}</h3>
                        <p class="text-sm text-slate-600 mb-4 whitespace-pre-line">${m.desc}</p>
                    </div>
                    <div class="flex justify-between items-center pt-3 border-t border-slate-100 text-xs text-slate-500">
                        <span>Jakaja: <strong class="text-slate-700">${m.author}</strong></span>
                        <button onclick="alert('Ladataan materiaalia... (Demo)')" class="text-blue-600 hover:underline font-medium">Lataa / Kopioi</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function addMaterial(event) {
            event.preventDefault();
            const title = document.getElementById('mat-title').value;
            const category = document.getElementById('mat-category').value;
            const desc = document.getElementById('mat-desc').value;
            const isAnonymous = document.getElementById('mat-anonymous').checked;

            const newMat = {
                id: materials.length + 1,
                title,
                category,
                desc,
                author: isAnonymous ? "Anonyymi opettaja" : currentUser,
                date: new Date().toLocaleDateString('fi-FI')
            };

            materials.unshift(newMat);
            renderMaterials();
            
            // Tyhjennä lomake
            document.getElementById('mat-title').value = '';
            document.getElementById('mat-desc').value = '';
            document.getElementById('mat-anonymous').checked = false;
        }

        function filterMaterials() {
            renderMaterials();
        }
    </script>
</body>
</html>
